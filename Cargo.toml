[package]
name = "feature-gate-multisig-tool"
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = [
    "nikita.belenkov@anza.xyz",
    "sean@sqds.io",
    "orion@sqds.io",
    "bastien@sqds.io",
]
description = "CLI tool for creating and managing Solana feature gate multisigs using the Squads protocol, for collective governance over feature activations and revocations"
repository = "https://github.com/nbelenkov/feature-gate-multisig"
readme = "README.md"
keywords = ["solana", "multisig", "governance", "feature-gates", "blockchain"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

# Direct dependencies are pinned exactly (`=`): this tool signs governance
# transactions, so versions must only move through reviewed bumps, never through
# an incidental `cargo update` or a fresh unlocked resolution.
[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
inquire = "=0.9.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
dirs = "=6.0.0"
borsh = "=1.7.0"
colored = "=3.1.1"
indicatif = "=0.18.6"
eyre = "=0.6.12"
tabled = "=0.21.0"

solana-rpc-client = "=3.1.14"
solana-rpc-client-api = "=3.1.14"
solana-clap-v3-utils = "=3.1.14"
# Depended on directly so hidapi stays compiled in and `usb://ledger` works;
# mirrors solana-remote-wallet's own default features.
solana-remote-wallet = { version = "=3.1.14", default-features = false, features = ["agave-unstable-api", "linux-static-hidraw"] }
solana-instruction = {version = "=3.4.0", features = ["bincode"]}
solana-pubkey = {version = "=4.2.0", features = ["borsh", "curve25519"]}
solana-keypair = "=3.1.2"
solana-signature = "=3.4.1"
solana-signer = "=3.0.1"
solana-transaction-status-client-types = "=3.1.14"
solana-message = "=3.1.0"
solana-transaction = {version = "=3.1.0", features = ["serde", "bincode"]}
solana-compute-budget-interface = "=3.0.0"
solana-system-interface = {version = "=3.2.0", features = ["bincode"]}
solana-commitment-config = "=3.1.1"
solana-hash = "=4.5.0"
solana-sha256-hasher = "=3.1.0"

[features]
# E2E escape hatch (`E2E_TEST_MODE`, auto-confirms every prompt). Compile-time
# opt-in so release binaries carry no env-var confirmation bypass; enabled by
# `make test-surfpool`.
e2e-harness = []

[dev-dependencies]
once_cell = "=1.21.4"

[lints.clippy]
# Panic prevention: production code must not crash on bad input or RPC errors.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# Code hygiene: no debugging or placeholder leftovers.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Safety.
exit = "deny"
mem_forget = "deny"
# Wider pedantic adoption is deferred (~260 findings) - track separately.
