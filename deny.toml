# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Unmaintained transitive crates pulled in by the Solana stack; not resolvable at
# this layer without an upstream Solana dependency bump. Reviewed and accepted;
# revisit and drop entries as Solana updates its tree.
ignore = [
  "RUSTSEC-2024-0375", # atty
  "RUSTSEC-2025-0141", # bincode
  "RUSTSEC-2026-0173", # proc-macro-error2 (unmaintained fork, no safe upgrade)
  "RUSTSEC-2024-0436", # paste (via ur-registry, keystone)
  "RUSTSEC-2024-0449", # unsafe-libyaml (via solana-cli-config)
]

[licenses]
version = 2
# Permissive licenses present in the dependency tree.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate crate versions are unavoidable in the Solana dependency tree; surface
# them without failing the build.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
