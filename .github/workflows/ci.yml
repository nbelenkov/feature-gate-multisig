name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # hidapi (via solana-remote-wallet) needs libudev to build on Linux.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      # Toolchain and components come from rust-toolchain.toml, so they are
      # declared in one place. rustflags is cleared because the action otherwise
      # sets `-D warnings` globally; clippy applies it explicitly below.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          rustflags: ""
          # It bundles rust-cache 2.9.1; we pin a newer one ourselves below.
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      # --all-targets compile-checks the E2E tests too; they need a live surfpool
      # validator to run, so they are not executed here.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Plain `cargo test` must be self-contained: the surfpool E2E tests are
      # #[ignore]d and only run via `make test-surfpool` (the e2e job).
      - name: Unit tests
        run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check

  e2e:
    name: e2e (surfpool)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    env:
      SURFPOOL_VERSION: v1.4.0
      # A release tag can be repointed at a different asset, so pin the content
      # too. Every action here is SHA-pinned and every crate is version- and
      # lockfile-pinned; this was the one artifact that was not.
      SURFPOOL_SHA256: b65e3e18da8e97a0558e04693d76a12aa31111c7d74958da7cee0fd2eeb4cae8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # hidapi (via solana-remote-wallet) needs libudev to build on Linux.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          rustflags: ""
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install surfpool
        run: |
          set -euo pipefail
          url="https://github.com/txtx/surfpool/releases/download/${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          curl -fsSL "$url" -o surfpool.tar.gz
          echo "${SURFPOOL_SHA256}  surfpool.tar.gz" | sha256sum -c -
          tar -xzf surfpool.tar.gz
          sudo install -m 755 surfpool /usr/local/bin/surfpool
          surfpool --version

      # surfpool clones the Squads program from mainnet on startup, so this job
      # needs outbound network access.
      - name: E2E tests
        run: make test-surfpool

      - name: Upload surfpool log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surfpool-log
          path: artifacts/surfpool.log
          if-no-files-found: ignore
